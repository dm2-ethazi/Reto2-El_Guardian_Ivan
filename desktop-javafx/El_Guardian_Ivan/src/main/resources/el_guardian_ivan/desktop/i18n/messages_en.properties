help.title=Help
help.subtitle=How to use the application, common questions and credits.
help.encrypt.title=How to encrypt a file
help.encrypt.1=1. In Encrypt, press Browse and choose the file.
help.encrypt.2=2. Type a long password. The eye lets you see what you typed.
help.encrypt.3=3. Check the output name and folder and press Encrypt file. A .hgw file will be created.
help.decrypt.title=How to decrypt a file
help.decrypt.1=1. In Decrypt, press Browse and choose the .hgw file.
help.decrypt.2=2. Type the same password you used to encrypt it.
help.decrypt.3=3. Press Decrypt file. The original is recovered with its extension.
help.faq.title=Frequently asked questions
help.faq1.q=What if I forget the password?
help.faq1.a=The file cannot be recovered. The password is not stored anywhere, not even in the application.
help.faq2.q=What is a .hgw file?
help.faq2.a=It is the encrypted format of El Guardián Iván. It can only be opened with this application and the right password.
help.faq3.q=Is the original file deleted when encrypting?
help.faq3.a=No. An encrypted copy is created and the original stays the same; delete it yourself if you no longer need it.
help.faq4.q=Are my files sent to the internet?
help.faq4.a=No. All encryption happens on your computer and the application does not connect to any server.
help.faq5.q=What if the .hgw file has been modified or is damaged?
help.faq5.a=It is detected when decrypting, and the application shows an error instead of returning wrong data.
