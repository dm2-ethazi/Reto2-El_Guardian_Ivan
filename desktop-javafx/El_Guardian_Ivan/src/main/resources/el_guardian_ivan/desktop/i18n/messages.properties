help.title=Ayuda
help.subtitle=Cómo se usa la aplicación, dudas habituales y créditos.
help.encrypt.title=Cómo cifrar un archivo
help.encrypt.1=1. En Cifrar, pulsa Examinar y elige el archivo.
help.encrypt.2=2. Escribe una contraseña larga. Con el ojo puedes ver lo que has escrito.
help.encrypt.3=3. Revisa el nombre y la carpeta de salida y pulsa Cifrar archivo. Se creará un archivo .hgw.
help.decrypt.title=Cómo descifrar un archivo
help.decrypt.1=1. En Descifrar, pulsa Examinar y elige el archivo .hgw.
help.decrypt.2=2. Escribe la misma contraseña que usaste al cifrarlo.
help.decrypt.3=3. Pulsa Descifrar archivo. Se recupera el original con su extensión.
help.faq.title=Preguntas frecuentes
help.faq1.q=¿Y si olvido la contraseña?
help.faq1.a=No se puede recuperar el archivo. La contraseña no se guarda en ningún sitio, ni siquiera en la aplicación.
help.faq2.q=¿Qué es un archivo .hgw?
help.faq2.a=Es el formato cifrado de El Guardián Iván. Solo se puede abrir con esta aplicación y la contraseña correcta.
help.faq3.q=¿Se borra el archivo original al cifrar?
help.faq3.a=No. Se crea una copia cifrada y el original queda igual; bórralo tú si ya no lo necesitas.
help.faq4.q=¿Se envían mis archivos a internet?
help.faq4.a=No. Todo el cifrado se hace en tu equipo y la aplicación no se conecta a ningún servidor.
help.faq5.q=¿Qué pasa si el archivo .hgw se ha modificado o está dañado?
help.faq5.a=Al descifrar se detecta y la aplicación muestra un error en lugar de devolver datos incorrectos.
help.shortcuts=Atajos de teclado
help.shortcut.nav=Ctrl+1, Ctrl+2, Ctrl+3 y Ctrl+4: ir a Inicio, Cifrar, Descifrar y Ajustes.
help.shortcut.help=F1: abrir esta ayuda.
help.shortcut.open=Ctrl+O: elegir el archivo en Cifrar o Descifrar.
help.shortcut.run=Intro en un campo de texto: cifrar o descifrar.
help.shortcut.move=Tab y Mayús+Tab: pasar de un control a otro. Flechas arriba y abajo: moverse por el menú lateral. Espacio: pulsar el botón marcado.
help.shortcut.close=Esc: cerrar la ventana de aviso.
