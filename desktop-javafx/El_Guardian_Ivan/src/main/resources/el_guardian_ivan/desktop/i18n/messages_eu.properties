help.title=Laguntza
help.subtitle=Aplikazioa nola erabili, ohiko zalantzak eta kredituak.
help.encrypt.title=Nola zifratu fitxategi bat
help.encrypt.1=1. Zifratu atalean, sakatu Arakatu eta aukeratu fitxategia.
help.encrypt.2=2. Idatzi pasahitz luze bat. Begiarekin idatzitakoa ikus dezakezu.
help.encrypt.3=3. Begiratu irteerako izena eta karpeta, eta sakatu Zifratu fitxategia. .hgw fitxategi bat sortuko da.
help.decrypt.title=Nola deszifratu fitxategi bat
help.decrypt.1=1. Deszifratu atalean, sakatu Arakatu eta aukeratu .hgw fitxategia.
help.decrypt.2=2. Idatzi zifratzeko erabili zenuen pasahitz bera.
help.decrypt.3=3. Sakatu Deszifratu fitxategia. Jatorrizkoa bere luzapenarekin berreskuratzen da.
help.faq.title=Ohiko galderak
help.faq1.q=Eta pasahitza ahazten badut?
help.faq1.a=Ezin da fitxategia berreskuratu. Pasahitza ez da inon gordetzen, ezta aplikazioan ere.
help.faq2.q=Zer da .hgw fitxategi bat?
help.faq2.a=El Guardián Iván-en formatu zifratua da. Aplikazio honekin eta pasahitz zuzenarekin bakarrik ireki daiteke.
help.faq3.q=Zifratzean jatorrizko fitxategia ezabatzen da?
help.faq3.a=Ez. Kopia zifratu bat sortzen da eta jatorrizkoa bere horretan geratzen da; ezabatu zuk behar ez baduzu.
help.faq4.q=Nire fitxategiak internetera bidaltzen dira?
help.faq4.a=Ez. Zifratze guztia zure ordenagailuan egiten da eta aplikazioa ez da inongo zerbitzarira konektatzen.
help.faq5.q=Zer gertatzen da .hgw fitxategia aldatu bada edo kaltetuta badago?
help.faq5.a=Deszifratzean antzematen da, eta aplikazioak errore bat erakusten du datu okerrak itzuli beharrean.
help.shortcuts=Teklatuko lasterbideak
help.shortcut.nav=Ctrl+1, Ctrl+2, Ctrl+3 eta Ctrl+4: joan Hasierara, Zifratzera, Deszifratzera eta Ezarpenetara.
help.shortcut.help=F1: ireki laguntza hau.
help.shortcut.open=Ctrl+O: aukeratu fitxategia Zifratu edo Deszifratu atalean.
help.shortcut.run=Sartu testu-eremu batean: zifratu edo deszifratu.
help.shortcut.move=Tab eta Maius+Tab: kontrol batetik bestera mugitu. Gora eta behera geziak: alboko menuan mugitu. Zuriunea: hautatutako botoia sakatu.
help.shortcut.close=Esc: itxi abisu-leihoa.
