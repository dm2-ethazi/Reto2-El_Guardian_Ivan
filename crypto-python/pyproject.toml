[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reto2-vigenere"
version = "0.1.0"
description = "Aplicación de cifrado Vigenère del Reto 02"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "coverage==7.17",
    "pytest-cov==7.1",
    "ruff==0.17.3",
    "black",
]

[tool.setuptools]
packages = ["src", "src.vigenere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src.vigenere"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py314"]
