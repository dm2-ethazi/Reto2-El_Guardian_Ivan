
# Pipeline de calidad para el módulo Python del Reto 02.
# Se ejecuta automáticamente en cada push y Pull Request.

name: Python - Tests y Calidad

on:
  push:
  pull_request:

# El workflow solo necesita leer el repositorio.
permissions:
  contents: read

jobs:
  calidad-python:
    runs-on: ubuntu-latest

    # Los comandos se ejecutan desde crypto-python,
    # donde tenemos pyproject.toml y los tests.
    defaults:
      run:
        working-directory: crypto-python

    steps:
      # Descarga el código del repositorio.
      - name: Obtener codigo
        uses: actions/checkout@v7

      # Configura Python en el servidor de GitHub.
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      # Instala las herramientas definidas en pyproject.toml.
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      # Ejecuta los tests y exige una cobertura minima del 80 %.
      - name: Tests unitarios y cobertura
        run: python -m pytest tests/ --cov=src.vigenere --cov-branch --cov-report=term-missing --cov-fail-under=80

      # Comprueba errores de estilo e importaciones.
      - name: Analisis estatico con Ruff
        run: python -m ruff check .

      # Comprueba el formato sin modificar archivos.
      - name: Comprobar formato con Black
        run: python -m black --check .
